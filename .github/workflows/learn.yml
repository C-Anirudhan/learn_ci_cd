on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  testing:
      name: tester
      runs-on: ubuntu-latest
      strategy:
        matrix:
          python-version: ['3.12.x','3.13.x']
      
      steps:
        - name: setup-repo
          uses: actions/checkout@v4
        
        - name: setup-python
          uses: actions/setup-python@v5
          with:
            python-version : ${{ matrix.python-version }}

        - name: Install-dependencies
          run: pip install -r requirements.txt
        
        - name: Run-test-code
          run: python test.py







